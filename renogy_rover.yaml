  - platform: template
    name: "Rover Power Generation Today"
    id: power_generation_today
    device_class: "energy"
    state_class: total_increasing
    unit_of_measurement: "Wh"
    accuracy_decimals: 0

  - platform: template
    name: "Rover Power Consumption Today"
    id: power_consumption_today
    device_class: "energy"
    unit_of_measurement: "Wh"
    accuracy_decimals: 0

  - platform: template
    name: "Rover Power Generation Total"
    id: power_generation_total
    device_class: "energy"
    state_class: total_increasing
    unit_of_measurement: "kWh"
    accuracy_decimals: 1

  - platform: ble_client
    ble_client_id: renogy_rover_esp32_bc
    id: renogy_rover_esp32_sensor
    internal: true
    type: characteristic
    service_uuid: FFF0
    characteristic_uuid: FFF1
    notify: true
    update_interval: never

    # on_notify: 
    #   then:
    #     - lambda: |-
    #         ESP_LOGD("ble_client.notify", "x: %.2f", x);

    lambda: |-      
      // A variable x of type esp32_ble_tracker::ESPBTDevice is passed to the automation for use in lambdas. (from docs)
      int receivedSize = x.size();
      ESP_LOGD("ble_client_lambda", "Received bytes size: %d", receivedSize);
      // Log each byte in the array
      for (size_t i = 0; i < receivedSize; ++i) {
        ESP_LOGD("main", "Response Byte %d: 0x%02X", i, x[i]);
      }
      if (receivedSize < 73) return NAN;

      HandleRoverData(x);
      return 0.0; // this sensor isn't actually used other than to hook into raw value and publish to template sensors


ble_client:
  - mac_address: ${ble_mac_address}
    name: Renogy Rover
    id: renogy_rover_esp32_bc   
    auto_connect: true 
    on_connect:
      then:
        - lambda: |-
            id(ble_connected) = true;
            id(ble_status).publish_state("Connected");
        - logger.log: 
            format: "BLE client connected to rover"
            level: DEBUG
    on_disconnect:
      then:
        - lambda: |-
            id(ble_connected) = false;
            id(ble_status).publish_state("Disconnected");
        - logger.log: 
            format: "BLE client disconnected from rover"
            level: DEBUG

interval:
  - interval: 5s
    then:
      - ble_client.ble_write: 
          characteristic_uuid: "FFD1"
          service_uuid: "FFD0"
          
          id: renogy_rover_esp32_bc
          value: !lambda |-
                    vector<uint8_t> request = GetRoverRequest();
                    return request;
  - interval: 10s
    then:
      - lambda: |-
          if (millis() - id(last_display_interaction) > 10000) {
            id(oled_display).turn_off();
          }

binary_sensor:
  - platform: ble_presence
    mac_address: ${ble_mac_address}
    name: "Renogy BLE Presence Rover"
    entity_category: "DIAGNOSTIC"

  # Button on GPIO0 (the "PRG" button on the Heltec board) to wake the display
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
    name: "Display Wake Button"
    on_press:
      - script.execute: wake_display

# Note: Automation component removed due to ESPHome version compatibility
# Display updates are handled by the 10-second interval timer

switch:
  - platform: template
    name: "Rover Load Switch"
    id: load_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - ble_client.ble_write:
          id: renogy_rover_esp32_bc
          service_uuid: "FFD0"
          characteristic_uuid: "FFD1"
          value: !lambda |-
            vector<uint8_t> request = GetLoadControlRequest(true);
            return request;
    turn_off_action:
      - ble_client.ble_write:
          id: renogy_rover_esp32_bc
          service_uuid: "FFD0"
          characteristic_uuid: "FFD1"
          value: !lambda |-
            vector<uint8_t> request = GetLoadControlRequest(false);
            return request;
