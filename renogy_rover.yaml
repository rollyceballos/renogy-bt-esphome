esphome:
  name: renogy-rover
  includes: 
    - renogy_rover_utilities.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(wifi_status).publish_state("Disconnected");
          id(ble_status).publish_state("Disconnected");
          id(mqtt_status).publish_state("Disconnected");
          id(pv_voltage).publish_state(0.0);
          id(pv_power).publish_state(0.0);
          ESP_LOGI("DISPLAY", "Sensors initialized");

globals:
  - id: last_display_interaction
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: wifi_connected
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ble_connected
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: mqtt_connected
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  - id: wake_display
    then:
      - lambda: |-
          id(oled_display).turn_on();
          id(last_display_interaction) = millis();
          ESP_LOGI("DISPLAY", "Wake display triggered");
      - display.page.show: status_page

esp32:
  board: heltec_wifi_kit_32
  framework:
    type: arduino

# Heltec WiFi 32 board configuration
i2c:
  sda: 4
  scl: 15
  scan: true

# OLED Display for status information
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    reset_pin: 16
    id: oled_display
    pages:
      - id: status_page
        lambda: |-
          // Clear display
          it.fill(COLOR_OFF);
          
          // Get current states from global variables
          std::string wifi_state = id(wifi_connected) ? "Connected" : "Disconnected";
          std::string ble_state = id(ble_connected) ? "Connected" : "Disconnected";
          std::string mqtt_state = id(mqtt_connected) ? "Connected" : "Disconnected";
          auto pv_voltage_val = id(pv_voltage).state;
          auto pv_power_val = id(pv_power).state;
          
          // WiFi Status
          it.printf(0, 0, id(oled_font), "WiFi: %s", wifi_state.c_str());
          
          // BLE Status
          it.printf(0, 12, id(oled_font), "BLE: %s", ble_state.c_str());
          
          // MQTT Status
          it.printf(0, 24, id(oled_font), "MQTT: %s", mqtt_state.c_str());
          
          // PV info
          it.printf(0, 36, id(oled_font), "PV: %.1fV %.1fW", pv_voltage_val, pv_power_val);

# Font configuration for OLED
font:
  - file: "gfonts://Roboto"
    id: oled_font
    size: 12

substitutions:
  # BLE MAC address loaded from secrets.yaml
  ble_mac_address: !secret renogy_rover_ble_mac
  

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    then:
      - lambda: |-
          id(wifi_connected) = true;
          id(wifi_status).publish_state("Connected");
      - logger.log: "WiFi connected"
  on_disconnect:
    then:
      - lambda: |-
          id(wifi_connected) = false;
          id(wifi_status).publish_state("Disconnected");
      - logger.log: "WiFi disconnected"

ota:
  platform: esphome

logger:
  level: INFO

# If you use Home Assistant please remove this `mqtt` section and uncomment the `api` component!
# The native API has many advantages over MQTT: https://esphome.io/components/api.html#advantages-over-mqtt
mqtt:
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_password
  id: mqtt_client
  on_connect:
    then:
      - lambda: |-
          id(mqtt_connected) = true;
          id(mqtt_status).publish_state("Connected");
      - logger.log: "MQTT connected"
  on_disconnect:
    then:
      - lambda: |-
          id(mqtt_connected) = false;
          id(mqtt_status).publish_state("Disconnected");
      - logger.log: "MQTT disconnected"
    
esp32_ble_tracker:
  scan_parameters:
    # We currently use the defaults to ensure Bluetooth
    # can co-exist with WiFi. In the future we may be able to
    # enable the built-in coexistence logic in ESP-IDF
    active: true


